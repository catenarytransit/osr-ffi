name: Rust and native bridge
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake build-essential
      - name: Native build and Rust tests
        run: cargo test --verbose
      - name: Standalone downstream executable without LD_LIBRARY_PATH
        run: |
          CARGO_TARGET_DIR="$PWD/target" cargo build --manifest-path tests/downstream-consumer/Cargo.toml --verbose
          env -u LD_LIBRARY_PATH ./target/debug/osr-ffi-downstream-consumer
          readelf -d ./target/debug/osr-ffi-downstream-consumer | grep -E 'RUNPATH|RPATH'
      - name: Release downstream consumer on Ubuntu 22.04
        run: |
          CARGO_TARGET_DIR="$PWD/target" cargo build --release --manifest-path tests/downstream-consumer/Cargo.toml --verbose
          env -u LD_LIBRARY_PATH ./target/release/osr-ffi-downstream-consumer
          readelf -d ./target/release/osr-ffi-downstream-consumer | grep -E 'RUNPATH|RPATH'
