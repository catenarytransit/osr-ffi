name: Rust and native bridge
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  native:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ninja-build cmake build-essential binutils libtbb-dev
      - name: Validate native C++23 toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$CXX" --version | head -n 1
          cat > /tmp/osr-cxx23-check.cc <<'EOF'
          #include <array>
          #include <ranges>
          #include <utility>
          int main() {
            std::array<int, 3> a{1, 2, 3};
            std::array<int, 3> b{4, 5, 6};
            for (auto [x, y] : std::views::zip(a, b)) { (void)x; (void)y; }
            for (auto chunk : std::views::chunk(a, 2)) { (void)chunk; }
            if (a.empty()) std::unreachable();
          }
          EOF
          "$CXX" -std=c++23 -Wall -Wextra -Werror -fsyntax-only /tmp/osr-cxx23-check.cc
      - name: Native build and Rust tests
        run: cargo test --verbose
      - name: Verify shared OSR dependencies and deferred CXX symbols
        shell: bash
        run: |
          set -euo pipefail
          bridge="$(find target/debug/build -path '*/out/native-lib/libcatenary_osr_bridge.so' -print -quit)"
          test -n "$bridge"
          readelf -d "$bridge" | tee /tmp/osr-native-dependencies.txt
          grep -F 'libtbb.so' /tmp/osr-native-dependencies.txt
          # CXX's implementations are linked into the consuming Rust binary,
          # not into this CMake-built shared library.
          ldd -r "$bridge" > /tmp/osr-native-symbols.txt 2>&1 || true
          cat /tmp/osr-native-symbols.txt
          python3 - <<'PY'
          from pathlib import Path

          failures = []
          for line in Path("/tmp/osr-native-symbols.txt").read_text().splitlines():
              if "not found" in line:
                  failures.append(line)
              elif "undefined symbol:" in line:
                  symbol = line.split("undefined symbol:", 1)[1].strip().split()[0]
                  if not (
                      symbol.startswith("_ZN4rust10cxxbridge1")
                      or symbol.startswith("cxxbridge1$")
                  ):
                      failures.append(line)
          if failures:
              raise SystemExit("Unexpected unresolved native dependencies:\n" + "\n".join(failures))
          PY
      - name: Standalone downstream executable without LD_LIBRARY_PATH
        run: |
          CARGO_TARGET_DIR="$PWD/target" cargo build --manifest-path tests/downstream-consumer/Cargo.toml --verbose
          env -u LD_LIBRARY_PATH LD_BIND_NOW=1 ./target/debug/osr-ffi-downstream-consumer
          readelf -d ./target/debug/osr-ffi-downstream-consumer | grep -E 'RUNPATH|RPATH'
          ldd -r ./target/debug/osr-ffi-downstream-consumer > /tmp/osr-downstream-debug-symbols.txt 2>&1
          cat /tmp/osr-downstream-debug-symbols.txt
          if grep -E 'undefined symbol|not found' /tmp/osr-downstream-debug-symbols.txt; then exit 1; fi
      - name: Release downstream consumer on Ubuntu 24.04
        run: |
          CARGO_TARGET_DIR="$PWD/target" cargo build --release --manifest-path tests/downstream-consumer/Cargo.toml --verbose
          env -u LD_LIBRARY_PATH LD_BIND_NOW=1 ./target/release/osr-ffi-downstream-consumer
          readelf -d ./target/release/osr-ffi-downstream-consumer | grep -E 'RUNPATH|RPATH'
          ldd -r ./target/release/osr-ffi-downstream-consumer > /tmp/osr-downstream-release-symbols.txt 2>&1
          cat /tmp/osr-downstream-release-symbols.txt
          if grep -E 'undefined symbol|not found' /tmp/osr-downstream-release-symbols.txt; then exit 1; fi
